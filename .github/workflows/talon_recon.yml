name: Talon Schedule Recon & Dispatch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium 

      - name: Run Scraper and Weather Engine
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TALON_USER: ${{ secrets.TALON_USER }}
          TALON_PASS: ${{ secrets.TALON_PASS }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCAL_WEBHOOK_URL: ${{ secrets.GCAL_WEBHOOK_URL }}
        run: python talon_scraper.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_failed_scrape.png
          retention-days: 3

      - name: Commit Updated Memory
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add memory.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Schedule and Weather Memory" && git push)
